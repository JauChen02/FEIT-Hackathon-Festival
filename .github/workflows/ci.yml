name: CI

# PLANNING.md §22.5: "CI runs lint, typecheck, unit, integration and E2E on
# every PR."
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # §21.3: CI is the `test` environment. Destructive commands are allowed here
  # and refused anywhere else.
  APP_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  LOG_LEVEL: silent

jobs:
  verify:
    name: lint · typecheck · test · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Postgres + GoTrue + Mailpit, the same stack developers run locally.
      - name: Start Supabase
        run: |
          pnpm supabase start \
            -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,pg_meta

      - name: Export Supabase keys
        run: |
          STATUS=$(pnpm --silent supabase status -o json)
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed the development data
        run: pnpm db:seed

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests (packages/core) and integration tests (packages/db,
      # apps/web) — §22.1 and §22.2.
      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter @learnarena/web exec playwright install --with-deps chromium

      # §22.3 critical journeys, against a real build and real Supabase Auth.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: pnpm supabase stop --no-backup || true
